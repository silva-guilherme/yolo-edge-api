services:
  yolo-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./output:/app/output
      - ./images:/app/images:ro
    environment:
      - MODEL_NAME=yolov8n.pt
    restart: unless-stopped
